name: Deploy game to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      COFFEE_LEVELS_DIR: .private-levels/publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check access to production levels
        env:
          LEVELS_TOKEN: ${{ secrets.COFFEE_LEVELS_TOKEN }}
        run: |
          if [ -z "$LEVELS_TOKEN" ]; then
            echo '::error::Set the COFFEE_LEVELS_TOKEN secret to publish production levels.'
            exit 1
          fi
      - name: Checkout production levels
        uses: actions/checkout@v4
        with:
          repository: vat-is-love/coffee-levels
          token: ${{ secrets.COFFEE_LEVELS_TOKEN }}
          path: .private-levels
          persist-credentials: false
          sparse-checkout: publish
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Set application version for this build
        run: node scripts/set-ci-version.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
