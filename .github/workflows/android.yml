name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for variable in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing signing secret: $variable. Follow docs/ANDROID.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coffee-match.jks"
      - name: Build signed APK and run Android lint
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/coffee-match.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GAME_URL: ${{ vars.ANDROID_GAME_URL || 'https://vat-is-love.github.io/coffee-in-a-row/' }}
        run: >-
          gradle -p android --no-daemon
          -PgameUrl="$GAME_URL"
          -PversionCode="$GITHUB_RUN_NUMBER"
          :app:assembleRelease :app:lintRelease
      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose
          android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: coffee-match-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/coffee-match.jks"
