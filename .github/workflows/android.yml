name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the signed APK as an update (public repository, default branch)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package is no longer available from Google.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for variable in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing signing secret: $variable. Follow docs/ANDROID.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coffee-match.jks"
      - name: Build signed APK and run Android lint
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/coffee-match.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GAME_URL: ${{ vars.ANDROID_GAME_URL || 'https://vat-is-love.github.io/coffee-in-a-row/' }}
        run: >-
          gradle -p android --no-daemon
          -PgameUrl="$GAME_URL"
          -PreleaseRepository="$GITHUB_REPOSITORY"
          -PversionCode="$GITHUB_RUN_NUMBER"
          :app:assembleRelease :app:lintRelease
      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose
          android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: coffee-match-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/coffee-match.jks"

  publish:
    needs: apk
    if: inputs.publish_release && !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coffee-match-apk
      - name: Publish APK and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="android-$GITHUB_RUN_NUMBER"
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          latest=0
          while IFS= read -r release; do
            if [[ "$release" =~ ^android-([1-9][0-9]*)$ ]] && (( BASH_REMATCH[1] > latest )); then
              latest="${BASH_REMATCH[1]}"
            fi
          done <<< "$published"
          if (( latest >= GITHUB_RUN_NUMBER )); then
            echo "Android build $latest is already published."
            exit 0
          fi

          mv app-release.apk CoffeeMatch.apk
          checksum="$(sha256sum CoffeeMatch.apk)"
          jq -n --argjson versionCode "$GITHUB_RUN_NUMBER" --arg sha256 "${checksum%% *}" \
            '{versionCode: $versionCode, sha256: $sha256}' > android-update.json
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true; then
            gh release upload "$tag" CoffeeMatch.apk android-update.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" CoffeeMatch.apk android-update.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Coffee Match Android build $GITHUB_RUN_NUMBER" \
              --notes "Signed Coffee Match APK for Android."
          fi
